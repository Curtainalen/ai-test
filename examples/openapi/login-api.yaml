openapi: 3.1.0
info:
  title: Login Acceptance API
  version: 1.0.0
servers:
  - url: http://mock-api:9000
paths:
  /login:
    post:
      tags: [认证]
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: 登录成功 }
        '401': { description: 登录失败 }
  /me:
    get:
      tags: [认证]
      summary: 获取当前用户
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
        '401': { description: 未授权 }
  /slow:
    get:
      tags: [认证]
      summary: 慢请求（Worker 恢复验收）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
